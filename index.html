<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>電卓</title>
  <meta name="theme-color" content="#01579B">
  <meta name="description" content="コンタクトレンズ店舗向けの電卓（割引・税込・商品呼び出し）">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="電卓">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="chip" id="btnHistory" type="button">履歴</button>
      <button class="chip" id="btnRegister" type="button">商品登録</button>
      <button class="chip primary" id="btnSelect" type="button">商品呼び出し</button>
    </header>

    <section class="display" id="display" title="タップでコピー">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </section>

    <main class="keys" id="keys">
      <button class="k pct span2" data-act="off">OFF%</button>
      <button class="k pct span2" data-act="up">UP%</button>

      <button class="k fn" data-act="ac">AC</button>
      <button class="k fn" data-act="bs" aria-label="バックスペース">⌫</button>
      <button class="k fn" data-act="tax">税込</button>
      <button class="k op" data-op="/">÷</button>

      <button class="k num" data-d="7">7</button>
      <button class="k num" data-d="8">8</button>
      <button class="k num" data-d="9">9</button>
      <button class="k op" data-op="*">×</button>

      <button class="k num" data-d="4">4</button>
      <button class="k num" data-d="5">5</button>
      <button class="k num" data-d="6">6</button>
      <button class="k op" data-op="-">−</button>

      <button class="k num" data-d="1">1</button>
      <button class="k num" data-d="2">2</button>
      <button class="k num" data-d="3">3</button>
      <button class="k op" data-op="+">+</button>

      <button class="k num span2" data-d="0">0</button>
      <button class="k num" data-d=".">.</button>
      <button class="k eq" data-act="eq">=</button>
    </main>
  </div>

  <!-- 下から出るシート（履歴・登録・呼び出しで共用） -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <button class="link" id="sheetBack" type="button" hidden>‹ 戻る</button>
        <h2 id="sheetTitle"></h2>
        <button class="link" id="sheetClose" type="button">閉じる</button>
      </div>
      <p class="sheet-sub" id="sheetSub"></p>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
